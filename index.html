<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>Güvenli Çekim</title>
    <script src="face-api.min.js"></script>
    <style>
        /* Genel Sayfa Düzeni */
        body { 
            margin: 0; padding: 0; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
            user-select: none; -webkit-user-select: none;
        }
        
        /* Kamera ve Canvas Alanı */
        .camera-container { 
            position: relative; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background: #000; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; }

        /* Üst Bilgi Çubuğu */
        #status-bar { 
            position: absolute; top: 40px; left: 0; right: 0; 
            text-align: center; z-index: 50; pointer-events: none;
        }
        .badge { 
            background: rgba(0,0,0,0.6); color: white; 
            padding: 8px 16px; border-radius: 20px; 
            font-size: 14px; display: inline-block; font-weight: 500;
            backdrop-filter: blur(4px);
        }
        #count-text { font-size: 11px; color: rgba(255,255,255,0.8); margin-top:5px; text-shadow: 0 1px 2px black; }

        /* Alt Kontrol Paneli */
        .controls { 
            position: absolute; bottom: 30px; left: 0; right: 0; 
            display: flex; justify-content: center; align-items: center; gap: 30px; 
            z-index: 100; padding: 0 20px;
        }

        /* Büyük Çekim Butonu (Shutter) */
        .btn-shutter { 
            width: 72px; height: 72px; 
            border-radius: 50%; 
            background-color: white; 
            border: 4px solid rgba(255,255,255,0.3); 
            cursor: pointer; 
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-shutter:active { transform: scale(0.9); background-color: #ddd; }
        .btn-shutter:disabled { background-color: #444; border-color: #222; opacity: 0.6; }

        /* Yan İkon Butonlar */
        .btn-icon { 
            width: 48px; height: 48px; 
            border-radius: 50%; 
            background: rgba(40, 40, 40, 0.6); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white; font-size: 20px; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-icon:active { background: rgba(255,255,255,0.2); }

        /* Geri Dön Butonu */
        #btn-back { 
            display: none; position: absolute; bottom: 40px; 
            background: white; color: black; 
            padding: 12px 30px; border-radius: 30px; 
            border: none; font-weight: bold; font-size: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            z-index: 101; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <span id="status-text" class="badge">Sistem Başlatılıyor...</span>
        <div id="count-text">Kayıtlı Yüz: 0</div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <button id="btn-back" onclick="kamerayaDon()">Kameraya Dön</button>

    <div class="controls" id="control-panel">
        <button class="btn-icon" onclick="kameraCevir()">🔄</button>
        <button class="btn-shutter" id="btn-shoot" onclick="fotografCek()" disabled></button>
        <button class="btn-icon" onclick="yuzTanit()">➕</button>
        <button class="btn-icon" onclick="hafizayiSil()" style="background: rgba(200, 50, 50, 0.6);">🗑️</button>
    </div>

    <script>
        // --- SERVICE WORKER (OFFLINE DESTEĞİ) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Offline Servis Hazır'))
                    .catch(err => console.log('SW Hatası:', err));
            });
        }

        // --- DEĞİŞKENLER ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status-text');
        const countText = document.getElementById('count-text');
        const btnShoot = document.getElementById('btn-shoot');
        const controlPanel = document.getElementById('control-panel');
        const btnBack = document.getElementById('btn-back');

        let labeledDescriptors = [];
        let currentFacingMode = 'environment'; // Başlangıç: Arka Kamera
        let isProcessing = false;

        // --- 1. SİSTEMİ BAŞLAT (Modelleri Yükle) ---
        async function sistemiBaslat() {
            statusText.innerText = "Modeller İndiriliyor (%0)...";
            btnShoot.disabled = true;

            try {
                // Modelleri ./models klasöründen çekiyoruz
                await faceapi.nets.ssdMobilenetv1.loadFromUri('./models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('./models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('./models');

                console.log("Modeller başarıyla yüklendi.");
                statusText.innerText = "Kamera Başlatılıyor...";
                
                hafizadanYukle(); // Eski kayıtları getir
                startVideo();     // Kamerayı aç

            } catch (err) {
                console.error(err);
                statusText.innerText = "HATA: Modeller bulunamadı!";
                alert("Hata: 'models' klasörü eksik veya yolu yanlış. İnternet bağlantınızı kontrol edip sayfayı yenileyin.");
            }
        }

        // --- 2. KAMERA FONKSİYONLARI ---
        function startVideo() {
            if(video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: currentFacingMode,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 } 
                } 
            }).then(stream => {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    statusText.innerText = "Sistem Hazır";
                    btnShoot.disabled = false;
                    video.play();
                };
            }).catch(err => {
                statusText.innerText = "Kamera İzni Gerekli!";
                console.error(err);
            });
        }

        function kameraCevir() {
            if (isProcessing) return;
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            statusText.innerText = "Kamera Çevriliyor...";
            startVideo();
        }

        // --- 3. YÜZ TANITMA (Kayıt) ---
        async function yuzTanit() {
            if(video.paused || isProcessing) return;
            
            statusText.innerText = "Yüz taranıyor, sabit durun...";
            
            // Tek bir yüz bulmaya çalış
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (detection) {
                const isim = prompt("Bu kişinin ismi ne?", "Misafir");
                if (isim) {
                    // Belleğe ekle
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(isim, [detection.descriptor]));
                    // Kalıcı hafızaya kaydet
                    hafizayaKaydet();
                    
                    statusText.innerText = `${isim} eklendi!`;
                    setTimeout(() => statusText.innerText = "Sistem Hazır", 2000);
                } else {
                    statusText.innerText = "İptal edildi.";
                }
            } else {
                alert("Yüz algılanamadı. Işığa dönün ve kameraya bakın.");
                statusText.innerText = "Sistem Hazır";
            }
        }

        // --- 4. FOTOĞRAF ÇEK & GİZLE (Ana İşlem) ---
        async function fotografCek() {
            if (labeledDescriptors.length === 0) {
                alert("Listede kimse yok! Önce '+' butonuyla yüz tanıtın.");
                return;
            }

            isProcessing = true;
            btnShoot.disabled = true;
            statusText.innerText = "İşleniyor...";
            
            // Görüntüyü dondur
            video.pause();

            // Canvas boyutlarını ayarla
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // 1. Orijinal fotoğrafı çiz
            ctx.drawImage(video, 0, 0);

            // 2. Tüm yüzleri tara
            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55); // Hassasiyet (0.6 standart, 0.55 daha sıkı)

            // 3. Yüzleri kontrol et ve gizle
            detections.forEach(detection => {
                const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                const box = detection.detection.box;

                // Eğer kişi "unknown" (bilinmiyor) ise:
                if (bestMatch.label === 'unknown') {
                    // Yüzün merkezi ve yarıçapı
                    const centerX = box.x + (box.width / 2);
                    const centerY = box.y + (box.height / 2);
                    // Yarıçapı yüz boyutuna göre ayarla (1.3 böleni ideal genişlik sağlar)
                    const radius = Math.max(box.width, box.height) / 1.3; 

                    ctx.save();
                    ctx.beginPath();
                    // Daire çiz
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2, true);
                    ctx.closePath();
                    ctx.clip(); // Sadece dairenin içini seçili alan yap

                    // Bulanıklık Efekti (Buzlu Cam)
                    ctx.filter = 'blur(20px)'; 
                    ctx.drawImage(canvas, 0, 0); // Filtreli halini üstüne çiz
                    
                    ctx.restore(); // Seçimi kaldır
                }
            });

            // Arayüzü güncelle
            video.style.display = 'none';
            canvas.style.display = 'block';
            statusText.innerText = "Kaydediliyor...";
            controlPanel.style.display = 'none';
            btnBack.style.display = 'block';

            // Otomatik İndirme Başlat
            setTimeout(() => {
                try {
                    const link = document.createElement('a');
                    const zaman = new Date().toISOString().replace(/:/g, '-').split('.')[0];
                    link.download = `GuvenliCekim_${zaman}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                    statusText.innerText = "Galeriye Kaydedildi ✅";
                } catch(e) {
                    statusText.innerText = "Otomatik kayıt başarısız. Resme basılı tutup kaydedin.";
                }
            }, 800);
        }

        // --- 5. YARDIMCI FONKSİYONLAR ---
        window.kamerayaDon = function() {
            isProcessing = false;
            canvas.style.display = 'none';
            video.style.display = 'block';
            video.play();
            
            controlPanel.style.display = 'flex';
            btnBack.style.display = 'none';
            btnShoot.disabled = false;
            statusText.innerText = "Sistem Hazır";
        }

        // --- 6. HAFIZA YÖNETİMİ (LocalStorage) ---
        function hafizayaKaydet() {
            // Float32Array verisini JSON uyumlu hale getir
            const data = labeledDescriptors.map(d => ({ 
                label: d.label, 
                descriptors: d.descriptors.map(desc => Array.from(desc)) 
            }));
            localStorage.setItem('akilli_kamera_db', JSON.stringify(data));
            guncelleSayi();
        }

        function hafizadanYukle() {
            const data = localStorage.getItem('akilli_kamera_db');
            if (data) {
                // JSON verisini tekrar face-api formatına (Float32Array) çevir
                labeledDescriptors = JSON.parse(data).map(d => 
                    new faceapi.LabeledFaceDescriptors(d.label, d.descriptors.map(desc => new Float32Array(desc)))
                );
                console.log(labeledDescriptors.length + " yüz hafızadan yüklendi.");
                guncelleSayi();
            }
        }

        window.hafizayiSil = function() {
            if(confirm("DİKKAT: Tüm kayıtlı yüzler silinecek. Onaylıyor musunuz?")) {
                localStorage.removeItem('akilli_kamera_db');
                labeledDescriptors = [];
                guncelleSayi();
                alert("Hafıza temizlendi.");
            }
        }

        function guncelleSayi() {
            countText.innerText = `Kayıtlı Yüz: ${labeledDescriptors.length}`;
        }

        // Uygulamayı Başlat
        sistemiBaslat();

    </script>
</body>
</html>
